name: CI

# Valida todo push e PR. O publish-nuget.yml só dispara em tag, então sem isto
# uma regressão só apareceria na hora de publicar.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build e testes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      # O pack é o que faz o PackageValidation rodar: ele compara a API deste build
      # com a do pacote publicado. Sem este passo a checagem só aconteceria na
      # release, quando já é tarde.
      - name: Pack e valida compatibilidade de API
        run: dotnet pack --configuration Release --no-build -o ./nupkg

      # Microsoft.Testing.Platform, não VSTest: o opt-in fica no global.json e os
      # argumentos do runner vão depois do --. A sintaxe antiga (--collect:"XPlat Code
      # Coverage") não coleta nada aqui e o run termina com "Zero testes executados".
      - name: Run tests
        run: >
          dotnet test --configuration Release --no-build --results-directory ./coverage
          -- --coverage --coverage-output-format cobertura

      # Sem gate de percentual por ora: o objetivo é medir antes de exigir.
      # O MTP nomeia um arquivo por projeto de teste, então o glob casa o sufixo.
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/**/*.cobertura.xml
          if-no-files-found: warn
